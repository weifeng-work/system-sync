# 造词:使用原版 ModifyDictionary 模式,按键改为 Ctrl+Shift+Z。
# 交互:按 Ctrl+Shift+Z 进入模式 → 左右方向键选择词组长度(默认 2 字)
#       → 空格/回车确认造词。
# 注意:KeyListOption 配置必须以 [键名] 为 section,值用 0=/1= 序号表示。
[ModifyDictionaryKey]
0=Control+Shift+Z

# 原版删词键(ForgetWord)改为 Control+0 禁用:
# 删词已由 tablehotkey 插件的 Ctrl+Shift+1~9 接管,
# 且调词序占用 Ctrl+7,需避开冲突。
[ForgetWord]
0=Control+0

[LookupPinyinKey]
0=Control+Alt+E
